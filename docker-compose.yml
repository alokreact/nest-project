services:
  mysql:
    image: mysql:8
    container_name: gingr-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: dev-box
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmypass"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: gingr-api
    restart: always
    ports:
      - "3008:3008"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
